name: Deploy to GitHub Pages

# On demand only while the repository cannot publish Pages (private repo on
# the Free plan). Once Pages is enabled (public repo, or paid plan — then set
# Settings → Pages → Source: GitHub Actions), restore the automatic trigger:
#
#   on:
#     push:
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gate and stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the page contract
        run: node scripts/check.mjs

      - name: Stage the site
        run: |
          mkdir -p dist
          cp index.html dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
